name: Extract PARSA Full Backup

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract backup
        run: |
          mkdir -p extracted_parsa
          unzip -o "parsa-full-data-backup-2026-09-17.zip" -d extracted_parsa
          echo "=== EXTRACTED FILES ==="
          find extracted_parsa -type f | sort
          echo "=== TOTAL SIZE ==="
          du -sh extracted_parsa

      - name: Search PARSA data
        run: |
          echo "=== IMPORTANT FILES ==="
          find extracted_parsa -type f | grep -Ei 'execution|executions|llm|table|data.?table|signal|position|equity|pattern|audit|forensic' | sort || true

      - name: Upload extracted backup
        uses: actions/upload-artifact@v4
        with:
          name: PARSA-FULL-BACKUP-EXTRACTED
          path: extracted_parsa/
          compression-level: 0
          retention-days: 7
